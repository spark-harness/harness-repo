name: pr-metadata

on:
  workflow_call:
    secrets:
      HARNESS_REPO_TOKEN:
        required: false
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout policy source
        uses: actions/checkout@v4
        with:
          repository: spark-harness/harness-repo
          ref: master
          token: ${{ secrets.HARNESS_REPO_TOKEN || github.token }}

      - name: Fetch PR commits
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/$REPO/pulls/$PR_NUMBER/commits" \
            | jq 'add' > "$RUNNER_TEMP/pr-commits.json"
          jq -r '.[].sha' "$RUNNER_TEMP/pr-commits.json"

      - name: Write PR body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"

      - name: Validate PR metadata
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          python3 scripts/validate-pr-metadata.py \
            --title "$PR_TITLE" \
            --body-file "$RUNNER_TEMP/pr-body.md" \
            --commits-file "$RUNNER_TEMP/pr-commits.json"
