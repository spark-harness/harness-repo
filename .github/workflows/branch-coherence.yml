name: branch-coherence

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  BUSINESS_REPOSITORY: "spark-harness/business-repo"
  IDL_REPOSITORY: "spark-harness/idl-repo"

jobs:
  branch-coherence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check same branch in required peer repositories
        shell: bash
        env:
          CURRENT_BRANCH: ${{ github.head_ref || github.ref_name }}
          GH_TOKEN: ${{ secrets.BRANCH_COHERENCE_TOKEN || github.token }}
        run: |
          set -euo pipefail

          if [ -z "$CURRENT_BRANCH" ]; then
            echo "::error::Cannot resolve current branch from GitHub context."
            exit 1
          fi

          requirement_id="$(grep -Eo '[A-Z][A-Z0-9]*-[0-9]+' <<<"$CURRENT_BRANCH" | tail -n 1 || true)"
          if [ -z "$requirement_id" ]; then
            echo "No requirement id found in branch $CURRENT_BRANCH; skip peer branch check."
            exit 0
          fi

          impact_file="requirements/$requirement_id/impact-analysis.md"
          if [ ! -f "$impact_file" ]; then
            echo "No $impact_file in this branch; skip peer branch check."
            exit 0
          fi

          idl_impact="$(python3 -c 'import re, sys; text=open(sys.argv[1], encoding="utf-8").read(); patterns=[r"(?im)^idl_impact:\s*\"?([^\"\n]+)", r"(?im)^-\s*Does this change involve protobuf IDL or external contracts:\s*\**\s*([^。\n*]+)"]; value="";
          for pattern in patterns:
              match=re.search(pattern, text)
              if match:
                  value=match.group(1).strip().lower()
                  break
          print(value)' "$impact_file")"

          required_repositories=""
          if grep -Eq 'business-repo|\\{business-repo\\}' "$impact_file"; then
            required_repositories="$required_repositories $BUSINESS_REPOSITORY"
          fi
          if [ "$idl_impact" = "yes" ]; then
            required_repositories="$required_repositories $IDL_REPOSITORY"
          fi

          if [ -z "${required_repositories// }" ]; then
            echo "No peer repository is required by $impact_file."
            exit 0
          fi

          encoded_branch="$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["CURRENT_BRANCH"], safe=""))')"

          missing=0
          for repo in $required_repositories; do
            echo "Checking $repo branch $CURRENT_BRANCH"
            if gh api --silent "repos/$repo/branches/$encoded_branch"; then
              echo "$repo has branch $CURRENT_BRANCH"
            else
              echo "::error title=Missing same-named branch::$repo does not have accessible branch $CURRENT_BRANCH"
              missing=1
            fi
          done

          exit "$missing"
