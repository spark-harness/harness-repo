name: harness-gates

# Harness 门禁 CI：用同一套 janus 判定阻断不合规的需求改动。
# 只检查本次改动涉及的 requirements/<id> 与 gate JSON（按 PR/push diff 定界），
# 不重新定义门禁规则（见 context/harness-framework/gate-implementation.md）。

on:
  push:
    paths:
      - "requirements/**"
      - ".spark/**"
      - "scripts/install.sh"
      - "context/harness-framework/**"
      - ".github/workflows/harness-gates.yml"
  pull_request:
    paths:
      - "requirements/**"
      - ".spark/**"
      - "scripts/install.sh"
      - "context/harness-framework/**"
      - ".github/workflows/harness-gates.yml"

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout harness-repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve janus ref
        id: janus-ref
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.JANUS_REPO_TOKEN || github.token }}
          CURRENT_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          if [ -n "${CURRENT_BRANCH:-}" ] && gh api --silent "repos/spark-harness/janus/branches/$CURRENT_BRANCH"; then
            echo "ref=$CURRENT_BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "ref=master" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout janus
        uses: actions/checkout@v4
        with:
          repository: spark-harness/janus
          ref: ${{ steps.janus-ref.outputs.ref }}
          path: .janus-src
          # janus is a separate repo; a read token is needed if it is private.
          token: ${{ secrets.JANUS_REPO_TOKEN || github.token }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: .janus-src/go.mod

      - name: Build janus
        working-directory: .janus-src
        run: |
          set -euo pipefail
          go build -o "$RUNNER_TEMP/bin/janus" ./cmd/janus
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Sanity checks
        run: |
          set -euo pipefail
          janus version
          jq empty .spark/hooks.json
          bash -n scripts/install.sh

      - name: Detect changed requirements and gates
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if ! git rev-parse --verify --quiet "${base}^{commit}" >/dev/null 2>&1; then
            base="$(git rev-parse --verify --quiet HEAD~1 || git rev-parse HEAD)"
          fi
          git diff --name-only --diff-filter=d "$base" HEAD > "$RUNNER_TEMP/changed.txt" || true
          grep -E '^requirements/[^/]+/' "$RUNNER_TEMP/changed.txt" \
            | sed -E 's#^requirements/([^/]+)/.*#\1#' | sort -u > "$RUNNER_TEMP/req_ids.txt" || true
          grep -E '^requirements/[^/]+/gates/.+\.gate\.json$' "$RUNNER_TEMP/changed.txt" \
            > "$RUNNER_TEMP/gate_jsons.txt" || true
          echo "changed requirements:"; cat "$RUNNER_TEMP/req_ids.txt" || true
          echo "changed gate JSONs:"; cat "$RUNNER_TEMP/gate_jsons.txt" || true

      - name: Gate JSON validation (changed gates)
        run: |
          set -euo pipefail
          while read -r g; do
            [ -z "$g" ] && continue
            echo "::group::validate $g"
            janus gate validate "$g"
            echo "::endgroup::"
          done < "$RUNNER_TEMP/gate_jsons.txt"

      - name: Requirement status (changed requirements, stage-aware)
        run: |
          set -euo pipefail
          while read -r id; do
            [ -z "$id" ] && continue
            echo "::group::status $id"
            janus requirement status "$id"
            echo "::endgroup::"
          done < "$RUNNER_TEMP/req_ids.txt"

      - name: Merge readiness (PR into default branch)
        if: github.event_name == 'pull_request' && github.base_ref == github.event.repository.default_branch
        run: |
          set -euo pipefail
          while read -r id; do
            [ -z "$id" ] && continue
            echo "::group::verify --target merge $id"
            janus requirement verify --requirement "$id" --target merge
            echo "::endgroup::"
          done < "$RUNNER_TEMP/req_ids.txt"
