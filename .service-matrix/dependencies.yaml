workspace: ".."
business_repo: "business-repo"
idl_repo: "idl-repo"
idl_format: "protobuf"
buf_config_version: "v2"
default_team: "core"

teams:
  core:
    business_repo: "business-repo"
    idl_repo: "idl-repo"

modules:
  shared:
    team: core
    name: "公共能力"

  user:
    team: core
    name: "用户域"

  frontend:
    team: core
    name: "前端体验"

libraries:
  money:
    module: shared
    repo_path: "{business-repo}/packages/money"
    language: java
    artifact: "com.spark.common:spark-money"
    purpose: "统一金额、币种、舍入和最小货币单位转换"

services:
  aegis:
    module: frontend
    repo_path: "{business-repo}/services/frontend/aegis"
    idl_required: false

  user-api:
    module: user
    repo_path: "{business-repo}/services/backend/user-api"
    idl_required: true
    idl_repo: "{idl-repo}"
    proto_path: "{idl-repo}/vesta/spark/user/v1"
    buf_module: "local/spark-user"

  fides-bff:
    module: frontend
    repo_path: "{business-repo}/services/backend/fides-bff"
    idl_required: false

dependencies:
  user-api:
    upstream:
      - "aegis"
    libraries:
      - "money"
