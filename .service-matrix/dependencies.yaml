workspace: ".."
business_repo: "business-repo"
idl_repo: "idl-repo"
idl_format: "protobuf"
buf_config_version: "v2"
default_team: "core"

teams:
  core:
    business_repo: "business-repo"
    idl_repo: "idl-repo"

modules:
  shared:
    team: core
    name: "公共能力"

  applicant:
    team: core
    name: "申请人域"

  pricing:
    team: core
    name: "报价与试算"

  frontend:
    team: core
    name: "前端体验"

libraries:
  money:
    module: shared
    repo_path: "{business-repo}/packages/java/money"
    language: java
    artifact: "com.spark.common:spark-money"
    purpose: "统一金额、币种、舍入和最小货币单位转换"

services:
  fides:
    module: frontend
    repo_path: "{business-repo}/apps/fides-web"
    idl_required: false

  fides-bff:
    module: frontend
    repo_path: "{business-repo}/apps/fides-bff"
    idl_required: true
    idl_repo: "{idl-repo}"
    proto_path: "{idl-repo}/vesta/lendora/fides-bff/v1"
    buf_module: "local/lendora-fides-bff"

  applicant-api:
    module: applicant
    repo_path: "{business-repo}/apps/applicant-api"
    idl_required: true
    idl_repo: "{idl-repo}"
    proto_path: "{idl-repo}/vesta/lendora/applicant/v1"
    buf_module: "local/lendora-applicant"

  quote-api:
    module: pricing
    repo_path: "{business-repo}/apps/quote-api"
    idl_required: false

dependencies:
  applicant-api:
    upstream:
      - "fides-bff"

  quote-api:
    upstream:
      - "fides-bff"
